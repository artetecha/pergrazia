name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify placement
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: commentario_ci
          MARIADB_DATABASE: commentario_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -pcommentario_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: pg

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer, wp-cli
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Assert build placement
        run: |
          test -f wordpress/wp-settings.php
          test -f wordpress/wp-config.php
          test -f wordpress/wp-content/mu-plugins/upsun/upsun.php
          test -f wordpress/wp-content/mu-plugins/upsun-loader.php
          test -f wordpress/wp-content/mu-plugins/site-config.php
          test -f wordpress/wp-content/mu-plugins/pg-commentario.php
          test -f wordpress/wp-content/mu-plugins/pg-commentario-editor.js
          test -f wordpress/wp-content/object-cache.php
          test -f wordpress/wp-content/themes/pergrazia/style.css
          test -f wordpress/wp-content/themes/pergrazia/functions.php
          test "$(find wordpress/wp-content/themes -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test ! -f wordpress/wp-content/plugins/hello.php

      - name: Lint project PHP
        run: |
          php -l wp-config.php
          find mu-plugins themes/pergrazia migrations scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install database export client
        run: sudo apt-get update -qq && sudo apt-get install -y mariadb-client

      - name: Set up disposable WordPress database
        run: |
          cat > wp-config-local.php <<'PHP'
          <?php
          define( 'DB_NAME', 'commentario_ci' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'commentario_ci' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'WP_HOME', 'http://localhost:8080' );
          define( 'WP_SITEURL', WP_HOME );
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_REDIS_DISABLED', true );
          PHP
          # The disposable localhost service has a self-signed database certificate.
          printf 'db export:\n  skip-ssl: true\n' > wp-cli.local.yml
          wp --path=wordpress core install --url=http://localhost:8080 --title='Commentario CI' --admin_user=ci --admin_email=ci@example.invalid --admin_password=ci-local-only --skip-email
          wp --path=wordpress theme activate pergrazia
          wp --path=wordpress rewrite structure '/%year%/%monthnum%/%day%/%postname%/'

      - name: Verify commentary and automatic migration
        run: |
          wp --path=wordpress eval-file tests/commentario.php
          wp --path=wordpress eval-file tests/commentario-migration.php
          test ! -s wordpress/wp-content/debug.log
