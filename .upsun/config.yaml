# Composer-managed WordPress on Upsun, with project source in pg/.

applications:
  pg:
    source:
      root: "pg"

    type: "php:8.4"

    runtime:
      extensions:
        - redis

    build:
      flavor: composer

    dependencies:
      php:
        wp-cli/wp-cli-bundle: "^2.12"
        psy/psysh: "^0.12.19"

    relationships:
      database: "pgdb:mysql"
      rediscache: "redis:redis"
      essearch: "es:elasticsearch"

    # These are legacy Platform.sh local mounts. Upsun's continuity-preserving
    # equivalent is instance; changing them to storage creates new empty data.
    mounts:
      "wordpress/wp-content/uploads":
        source: instance
        source_path: "uploads"
      "wordpress/wp-content/cache":
        source: instance
        source_path: "cache"
      "wordpress/wp-content/wp-cloudflare-super-page-cache":
        source: instance
        source_path: "wp-cloudflare-page-cache"

    web:
      locations:
        "/":
          root: "wordpress"
          passthru: "/index.php"
          index:
            - "index.php"
          expires: 600
          scripts: true
          allow: true
          headers:
            X-Content-Type-Options: nosniff
          rules:
            ^/composer\.(json|lock)$:
              allow: false
            ^/license\.txt$:
              allow: false
            ^/readme\.html$:
              allow: false
            ^/xmlrpc\.php$:
              allow: false
        "/wp-content/cache":
          root: "wordpress/wp-content/cache"
          scripts: false
          allow: false
        "/wp-content/uploads":
          root: "wordpress/wp-content/uploads"
          scripts: false
          allow: true
          headers:
            X-Content-Type-Options: nosniff

    hooks:
      deploy: |
        set -e
        bash scripts/deploy.sh
      post_deploy: |
        set -e
        bash scripts/post-deploy.sh

    crons:
      wp-cron:
        spec: "*/5 * * * *"
        cmd: "cd wordpress && wp cron event run --due-now"

services:
  pgdb:
    type: mariadb:11.8
  redis:
    type: redis:8.0
  es:
    type: elasticsearch:7.10

routes:
  "https://www.{default}/":
    type: upstream
    upstream: "pg:http"
    cache:
      enabled: true
      cookies:
        - "/^wordpress_logged_in_/"
        - "/^wordpress_sec_/"
        - "wordpress_test_cookie"
        - "/^wp-settings-/"
        - "/^wp-postpass/"
        - "PHPSESSID"

  "https://{default}/":
    type: redirect
    to: "https://www.{default}/"
